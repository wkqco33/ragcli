name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            binary_name: ragcli
          - os: macos-14
            platform: darwin
            arch: arm64
            binary_name: ragcli
          - os: windows-latest
            platform: windows
            arch: amd64
            binary_name: ragcli.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure GitLab credentials (Unix)
        if: runner.os != 'Windows'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -n "$GITLAB_TOKEN" ]; then
            CLEAN_TOKEN=$(printf '%s' "$GITLAB_TOKEN" | tr -d '\n\r')
            git config --global url."https://oauth2:${CLEAN_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
          fi

      - name: Configure GitHub credentials (Unix)
        if: runner.os != 'Windows'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            CLEAN_TOKEN=$(printf '%s' "$GH_PAT" | tr -d '\n\r')
            git config --global url."https://x-access-token:${CLEAN_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Configure GitLab credentials (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if ($env:GITLAB_TOKEN) {
            $token = $env:GITLAB_TOKEN.Trim()
            git config --global url."https://oauth2:$token@gitlab.com/".insteadOf "https://gitlab.com/"
          }

      - name: Configure GitHub credentials (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if ($env:GH_PAT) {
            $token = $env:GH_PAT.Trim()
            git config --global url."https://x-access-token:$token@github.com/".insteadOf "https://github.com/"
          }

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf autoconf-archive automake libtool pkg-config ninja-build cmake

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install automake libtool pkg-config ninja cmake
          git config --global credential.helper ""

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout --detach 9d7f79f56ae1a9b4704d6a7fb8237e347a974133
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:USERPROFILE\vcpkg"
          git -C "$env:USERPROFILE\vcpkg" checkout --detach 9d7f79f56ae1a9b4704d6a7fb8237e347a974133
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat"
          "VCPKG_ROOT=$env:USERPROFILE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_HOST_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake --preset release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          mkdir -p licenses
          while IFS= read -r license; do
            package=$(basename "$(dirname "$license")")
            cp "$license" "licenses/${package}-copyright"
          done < <(find build/release/vcpkg_installed -type f -name copyright | sort)
          cp build/release/ragcli "${{ matrix.binary_name }}"
          ARCHIVE="dist/ragcli_${{ matrix.platform }}_${{ matrix.arch }}.tar.gz"
          tar -czf "$ARCHIVE" "${{ matrix.binary_name }}" LICENSE THIRD_PARTY_NOTICES licenses
          # ppm PACKAGE_GUIDE: ship a SHA-256 checksum alongside every archive
          # so users with require_checksum: true can verify integrity.
          (cd dist && shasum -a 256 "$(basename "$ARCHIVE")" > "$(basename "$ARCHIVE").sha256")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path licenses | Out-Null
          Get-ChildItem -Path "build/release/vcpkg_installed" -Filter "copyright" -File -Recurse |
            ForEach-Object { Copy-Item $_.FullName (Join-Path "licenses" "$($_.Directory.Name)-copyright") }
          Copy-Item "build/release/ragcli.exe" "ragcli.exe"
          Compress-Archive -Path "ragcli.exe", "LICENSE", "THIRD_PARTY_NOTICES", "licenses" -DestinationPath "dist/ragcli_windows_amd64.zip" -Force
          # ppm PACKAGE_GUIDE: ship a SHA-256 checksum alongside the archive.
          $h = (Get-FileHash "dist/ragcli_windows_amd64.zip" -Algorithm SHA256).Hash
          "$h  ragcli_windows_amd64.zip" | Out-File -Encoding ascii "dist/ragcli_windows_amd64.zip.sha256"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Upload workflow artifacts
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: ragcli-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
