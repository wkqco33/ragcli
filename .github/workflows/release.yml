name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            binary_name: ragcli
          - os: macos-14
            platform: darwin
            arch: arm64
            binary_name: ragcli
          - os: windows-latest
            platform: windows
            arch: amd64
            binary_name: ragcli.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure GitLab credentials (Unix)
        if: runner.os != 'Windows'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -n "$GITLAB_TOKEN" ]; then
            CLEAN_TOKEN=$(printf '%s' "$GITLAB_TOKEN" | tr -d '\n\r')
            git config --global url."https://oauth2:${CLEAN_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
          fi

      - name: Configure GitHub credentials (Unix)
        if: runner.os != 'Windows'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            CLEAN_TOKEN=$(printf '%s' "$GH_PAT" | tr -d '\n\r')
            git config --global url."https://x-access-token:${CLEAN_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Configure GitLab credentials (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if ($env:GITLAB_TOKEN) {
            $token = $env:GITLAB_TOKEN.Trim()
            git config --global url."https://oauth2:$token@gitlab.com/".insteadOf "https://gitlab.com/"
          }

      - name: Configure GitHub credentials (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if ($env:GH_PAT) {
            $token = $env:GH_PAT.Trim()
            git config --global url."https://x-access-token:$token@github.com/".insteadOf "https://github.com/"
          }

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf autoconf-archive automake libtool pkg-config ninja-build cmake

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install automake libtool pkg-config ninja cmake
          git config --global credential.helper ""

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:USERPROFILE\vcpkg"
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat"
          "VCPKG_ROOT=$env:USERPROFILE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # CMake picks up MinGW g++ from PATH on windows-latest (no MSVC dev
          # shell is configured here), so vcpkg must build its C++ deps
          # (cpr/spdlog/fmt/curl) with the same MinGW toolchain and ABI.
          # Otherwise MSVC-mangled symbols from the default x64-windows
          # triplet fail to link against GCC-mangled object files. Static
          # linkage also matches the release packaging step, which ships a
          # single ragcli.exe with no accompanying DLLs.
          "VCPKG_DEFAULT_TRIPLET=x64-mingw-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_HOST_TRIPLET=x64-mingw-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake --preset release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake --preset release
          -DVCPKG_TARGET_TRIPLET=x64-mingw-static
          -DVCPKG_HOST_TRIPLET=x64-mingw-static

      - name: Build
        run: cmake --build --preset release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/release/ragcli "${{ matrix.binary_name }}"
          tar -czf "dist/ragcli_${{ matrix.platform }}_${{ matrix.arch }}.tar.gz" "${{ matrix.binary_name }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build/release/ragcli.exe" "ragcli.exe"
          Compress-Archive -Path "ragcli.exe" -DestinationPath "dist/ragcli_windows_amd64.zip" -Force

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Upload workflow artifacts
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ragcli-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
